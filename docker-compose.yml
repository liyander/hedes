services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integra
      POSTGRES_USER: integra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integra-dev-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integra"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://integra:${POSTGRES_PASSWORD:-integra-dev-only}@db:5432/integra
      PUBLIC_BASE_URL: http://localhost:8000
    ports: ["8000:8000"]
    volumes: [appdata:/srv/backend/data]

volumes:
  pgdata:
  appdata:
