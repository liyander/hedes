template:
  id: nvd
  title: NVD CVE database
  category: Vulnerabilities
  summary: CRITICAL-severity CVEs from the U.S. National Vulnerability Database (CVSS v3), as alert events.
  free_tier: Free. An API key is optional but raises the rate limit (get one at nvd.nist.gov/developers/request-an-api-key).
  docs: https://nvd.nist.gov/developers/vulnerabilities
  credential: null
  variables:
    - {name: severity, label: Minimum CVSS v3 severity bucket, placeholder: CRITICAL, pattern: "^(LOW|MEDIUM|HIGH|CRITICAL)$", default: CRITICAL, help: "One of LOW, MEDIUM, HIGH, CRITICAL"}
  setup:
    - No account is needed. Without a key NVD allows 5 requests per 30 seconds; the connector throttles itself to stay below that.
    - The first run reads CVEs published in the last 30 days; later runs read only CVEs published since the previous run (up to 5 pages of 100 per run). Re-reads are de-duplicated.
schema_version: "1.0"
integration:
  id: nvd
  name: NVD CVE database
  version: "1.0.0"
  transport: http
  description: CVEs from the National Vulnerability Database in the common alert format.
  base_url: https://services.nvd.nist.gov
  authentication:
    type: none
  rate_limit: {requests_per_minute: 8}
  operations:
    - id: list_cves
      description: CVEs filtered by CVSS v3 severity
      method: GET
      path: /rest/json/cves/2.0
      input_schema:
        type: object
        properties: {}
      request:
        query: {cvssV3Severity: "{{severity}}"}
      pagination: {type: offset, offset_param: startIndex, size_param: resultsPerPage, size: 100, total_path: "$.totalResults", max_pages: 5}
      retry: {max_attempts: 4, backoff_seconds: 6, max_wait_seconds: 60}
      response:
        status_codes: [200]
        items_path: "$.vulnerabilities"
        max_bytes: 12000000
      ingest:
        entity: event
        category: vulnerability
        fields:
          event_id: "$.cve.id"
          timestamp: "$.cve.published"
          actor: "$.cve.sourceIdentifier"
          severity: "$.cve.metrics.cvssMetricV31[0].cvssData.baseSeverity"
          message: "$.cve.descriptions[0].value"
        defaults: {action: cve_published, outcome: unknown}
        # NVD returns the oldest CVEs first, so read by publication date. Both dates are required and at most 120 days apart.
        incremental: {param: pubStartDate, end_param: pubEndDate, format: iso8601_millis, initial_lookback_days: 30, max_window_days: 120, overlap_seconds: 3600}
        schedule: {interval_minutes: 360}
